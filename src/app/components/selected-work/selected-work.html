<section id="work" class="selected-work" aria-labelledby="work-title">
  <div class="selected-work__intro">
    <div>
      <p class="selected-work__eyebrow">A few things I have been building</p>
      <h2 id="work-title">Selected work</h2>
    </div>
    <p class="selected-work__count">
      <strong>{{ projects().length }}</strong>
      projects on the reel
    </p>
  </div>

  <div class="selected-work__list">
    @for (project of projects(); track project.slug) {
      <app-project-card
        [project]="project"
        [expanded]="activeProjectSlug() === project.slug"
        (toggleRequested)="toggleProject($event)"
      />
    }
  </div>
</section>
