<section id="work" class="selected-work" aria-labelledby="work-title" data-motion-work-section>
  <div class="selected-work__intro" data-motion-reveal data-motion-work-intro>
    <div>
      <p class="selected-work__eyebrow">A few things I have been building</p>
      <h2 id="work-title">Selected work</h2>
    </div>
    <p class="selected-work__count">
      <strong>{{ projects().length }}</strong>
      projects on the reel
    </p>

    <div class="selected-work__progress" aria-hidden="true">
      <span data-motion-work-progress></span>
    </div>
  </div>

  <div class="selected-work__list">
    @for (project of projects(); track project.slug) {
      <app-project-card
        data-motion-project
        data-motion-reveal
        [project]="project"
        [expanded]="activeProjectSlug() === project.slug"
        (toggleRequested)="toggleProject($event)"
      />
    }
  </div>
</section>
