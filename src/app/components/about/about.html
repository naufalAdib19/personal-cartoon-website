<section id="about" class="about" aria-labelledby="about-title">
  <header class="about__header">
    <p>Behind the build</p>
    <h2 id="about-title">Production notes</h2>
  </header>

  <div class="about__layout">
    <article class="about__note">
      <span class="about__code-mark" aria-hidden="true">&lt;/&gt;</span>
      <p class="about__note-label">A little about me</p>
      <div class="about__copy">
        @for (paragraph of paragraphs(); track paragraph) {
          <p>{{ paragraph }}</p>
        }
      </div>
      <p class="about__availability">{{ availability() }}</p>
    </article>

    <ul class="about__focus" aria-label="Engineering focus areas">
      @for (focusArea of focusAreas(); track focusArea.title) {
        <li>
          <h3>{{ focusArea.title }}</h3>
          <p>{{ focusArea.description }}</p>
        </li>
      }
    </ul>
  </div>
</section>
